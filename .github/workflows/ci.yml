name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pins firebase-tools to the exact version mealsense-app/package.json already
# depends on, so the emulator behaves identically to local dev instead of
# drifting to whatever "latest" happens to be on a given CI run.
env:
  FIREBASE_TOOLS_VERSION: 15.28.1

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mealsense-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # The Firestore emulator (started below) needs a JRE.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install firebase-tools
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      # Started as a plain background process, NOT via `firebase
      # emulators:exec`, deliberately: emulators:exec injects
      # FIRESTORE_EMULATOR_HOST into the whole wrapped process's
      # environment, which would break the tests that specifically verify
      # the "Firestore not configured" fallback (test_routes.py's
      # firestore_not_configured fixture, test_firestore_client.py) — those
      # rely on FIRESTORE_EMULATOR_HOST being unset ambiently and only mock
      # around the Application Default Credentials path instead. The
      # emulator-backed tests each set FIRESTORE_EMULATOR_HOST for
      # themselves per-test via monkeypatch (see their autouse emulator_env
      # fixtures), exactly mirroring local dev, where a developer runs the
      # emulator in one terminal and pytest in another with no shell-wide
      # env var either.
      - name: Start Firestore emulator
        working-directory: mealsense-app
        run: |
          firebase emulators:start --only firestore --project demo-mealsense-ci &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              echo "Firestore emulator is up"
              exit 0
            fi
            sleep 1
          done
          echo "Firestore emulator did not come up in time" >&2
          exit 1

      - name: Run backend test suite
        run: pytest --cov=services --cov=routers --cov-report=term-missing

  frontend:
    name: Frontend typecheck + Firestore rules tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mealsense-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The Firestore emulator (used by `npm run test:rules`, via
      # `firebase emulators:exec`) needs a JRE.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Firestore security rules tests
        run: npm run test:rules
